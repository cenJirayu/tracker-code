; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Only build/upload the production firmware by default. The enc_test probe must
; be selected explicitly (pio run -e enc_test ...) so a bare `pio run -t upload`
; never flashes the diagnostic over the HIL firmware.
[platformio]
default_envs = esp32s3usbotg

; Settings shared by every environment.
[env]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Iinclude

; Library dependencies
lib_deps =
    waspinator/AccelStepper@^1.64
    sparkfun/SparkFun u-blox GNSS v3@^3.1.1
    bblanchon/ArduinoJson@^7.4.1

; --- HIL test firmware (default) ---
; Build everything under src/ EXCEPT the diagnostic tools in src/diag/ and the
; standalone mission firmware in src/mission/.
[env:esp32s3usbotg]
build_src_filter = +<*> -<diag/> -<mission/>

; --- Standalone mission firmware ---
; Real-launch build: telemetry over UART from the ground Heltec, low-power
; armed standby, automatic launch detection. Flash with `pio run -e mission -t upload`.
[env:mission]
build_src_filter = +<mission/>

