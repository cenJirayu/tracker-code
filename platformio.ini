; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Only build/upload the production firmware by default. The enc_test probe must
; be selected explicitly (pio run -e enc_test ...) so a bare `pio run -t upload`
; never flashes the diagnostic over the HIL firmware.
[platformio]
default_envs = esp32s3usbotg

; Settings shared by every environment.
[env]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Iinclude

; Library dependencies
lib_deps =
    waspinator/AccelStepper@^1.64
    sparkfun/SparkFun u-blox GNSS v3@^3.1.1
    bblanchon/ArduinoJson@^7.4.1

; --- Production HIL firmware (default) ---
; Build everything under src/ EXCEPT the diagnostic tools in src/diag/.
[env:esp32s3usbotg]
build_src_filter = +<*> -<diag/>

; --- Standalone AS5048A encoder probe ---
; Build ONLY src/diag/enc_probe.cpp (its own setup()/loop(), no main.cpp).
;   pio run -e enc_test -t upload   &&   pio device monitor
[env:enc_test]
build_src_filter = -<*> +<diag/enc_probe.cpp>
