; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3usbotg]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -Iinclude

; Library dependencies
lib_deps =
    waspinator/AccelStepper@^1.64
    sparkfun/SparkFun u-blox GNSS v3@^3.1.1
    sparkfun/SparkFun MMC5983MA Magnetometer Arduino Library@^1.0.4
    bblanchon/ArduinoJson@^7.4.1

; ===========================================================================
;  Native unit-test environment (runs on the host PC, no ESP32 hardware).
;
;    pio test -e native            # run all suites
;    pio test -e native -f test_navigation   # run one suite
;
;  Pure modules (Navigation, TelemetryPacket) compile directly. The PID core
;  in ActuatorControl pulls in AccelStepper/SPI/MCPWM, so the test_pan_pid
;  suite supplies tiny host-side mocks of those headers via -I test/mocks.
;  The production esp32s3usbotg build never sees those mocks.
; ===========================================================================
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Iinclude
    -Itest/mocks
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-12
; GNSSManager depends on the u-blox library + Wire.h, which don't exist on the
; host. It has no native test yet, so exclude it from this env. (ActuatorControl
; compiles natively against the headers in test/mocks.)
lib_ignore = GNSSManager
debug_test = native